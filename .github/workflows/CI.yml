name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    tags: '*'
  schedule:
    - cron: '0 15 */14 * *'

# Cancel redundant CI tests automatically
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_tests:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    # A normal run takes 10-30 minutes. This is a backstop in case a download
    # hangs after all, so that a job cannot occupy a runner for hours.
    timeout-minutes: 90
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
          # - 'pre'
        os:
          - ubuntu-latest
          - macos-15-intel
          - windows-latest
        arch:
          - x64
        allow_failure: [false]
        include:
          - os: macOS-latest
            arch: aarch64
            version: 'lts'
            allow_failure: false
          - os: macOS-latest
            arch: aarch64
            version: '1'
            allow_failure: false
          - os: macOS-latest
            arch: aarch64
            version: '1.12'
            allow_failure: true
          # Julia 1.13 is the current stable release; test it explicitly on Linux
          # so a regression there is visible independently of the '1' alias.
          - os: ubuntu-latest
            arch: x64
            version: '1.13'
            allow_failure: false
          # Track the upcoming release so breakage is caught early, without
          # blocking CI when an unreleased Julia is temporarily broken.
          - os: ubuntu-latest
            arch: x64
            version: 'pre'
            allow_failure: true
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
        with:
          include-matrix: false
      - uses: julia-actions/julia-buildpkg@latest
      # Cache the topography tiles that the tests download (see
      # test/topo_prefetch.jl), so push/PR runs do not depend on the GMT data
      # server. The key changes with the prefetch list; `restore-keys` then
      # still restores the previous tiles, so only the new ones are fetched
      # rather than every job of the matrix fetching everything at once (the
      # server throttles that, and a throttled job used to run for two hours).
      #
      # `import_topo` keeps the tiles in its own scratch space rather than in
      # ~/.gmt, which is where GMT used to put them; the UUID is the package's.
      # ~/.gmt is still cached for import_GeoTIFF, which does go through GMT.
      # The decoded .raw files are left out: they are rebuilt from the tiles.
      - uses: actions/cache/restore@v6
        id: gmt-cache
        with:
          path: |
            ~/.julia/scratchspaces/3700c31b-fa53-48a6-808a-ef22d5a84742/topo_tiles
            !~/.julia/scratchspaces/3700c31b-fa53-48a6-808a-ef22d5a84742/topo_tiles/*.raw
            !~/.julia/scratchspaces/3700c31b-fa53-48a6-808a-ef22d5a84742/topo_tiles/*.part
            !~/.julia/scratchspaces/3700c31b-fa53-48a6-808a-ef22d5a84742/topo_tiles/server_unreachable_until
            ~/.gmt
          key: gmt-topo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('test/topo_prefetch.jl') }}
          restore-keys: |
            gmt-topo-${{ runner.os }}-${{ runner.arch }}-
      # The scheduled run tests the download itself: clear the tiles, whichever
      # cache they came from (julia-actions/cache restores ~/.julia, scratch
      # spaces included), so that test/topo_prefetch.jl has to fetch them.
      - name: Clear topography cache (scheduled run)
        if: github.event_name == 'schedule'
        shell: bash
        run: rm -rf ~/.julia/scratchspaces/3700c31b-fa53-48a6-808a-ef22d5a84742/topo_tiles
      - uses: julia-actions/julia-runtest@latest
      - uses: actions/cache/save@v6
        if: always() && steps.gmt-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.julia/scratchspaces/3700c31b-fa53-48a6-808a-ef22d5a84742/topo_tiles
            !~/.julia/scratchspaces/3700c31b-fa53-48a6-808a-ef22d5a84742/topo_tiles/*.raw
            !~/.julia/scratchspaces/3700c31b-fa53-48a6-808a-ef22d5a84742/topo_tiles/*.part
            !~/.julia/scratchspaces/3700c31b-fa53-48a6-808a-ef22d5a84742/topo_tiles/server_unreachable_until
            ~/.gmt
          key: gmt-topo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('test/topo_prefetch.jl') }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false  # or true if you want CI to fail when Codecov fails
