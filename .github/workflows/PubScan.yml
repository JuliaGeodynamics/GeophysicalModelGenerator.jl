name: Publication scan

on:
  schedule:
    - cron: "0 5 1,15 * *"  # 1st and 15th of the month, 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the report (no pull request)"
        type: boolean
        default: false
      since:
        description: "Scan works published since YYYY-MM-DD (default: lookback in _pubbot/config.toml)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publication-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pushing a new scan would overwrite edits made while reviewing the open one.
      - name: Skip while a scan pull request is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --head pubbot/scan --state open --json number --jq length)
          echo "skip=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$n" -gt 0 ] && echo "::notice::A scan pull request is still open, skipping." || true

      - uses: julia-actions/setup-julia@v3
        if: steps.open.outputs.skip != 'true'
        with:
          version: "1"
      - uses: julia-actions/cache@v3
        if: steps.open.outputs.skip != 'true'

      - name: Scan
        id: scan
        if: steps.open.outputs.skip != 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SINCE: ${{ inputs.since }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          julia --project=_pubbot -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
          args=(--report "$RUNNER_TEMP/report.md")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          julia --project=_pubbot _pubbot/weekly.jl "${args[@]}"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open pull request
        if: steps.scan.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: pubbot/scan
          delete-branch: true
          title: "Publications: new papers from the latest scan"
          body-path: ${{ runner.temp }}/report.md
          commit-message: "Add publications from scan"
          labels: publication
          add-paths: |
            docs/src/man/publications.md
            _pubbot/seen_dois.txt
