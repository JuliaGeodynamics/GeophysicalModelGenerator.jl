name: Add a publication
description: Add papers to the Publications page from their DOI (repository collaborators).
title: "[Publication] "
labels: ["publication"]
body:
  - type: markdown
    attributes:
      value: |
        Paste one or more DOIs. A pull request with the formatted entries is opened automatically
        for review. Papers should use GeophysicalModelGenerator.jl.
  - type: textarea
    id: dois
    attributes:
      label: DOI(s)
      description: One per line, e.g. `10.1038/s41467-024-55443-z` or `https://doi.org/10.1038/s41467-024-55443-z`.
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Note
      description: Optional context for the reviewer.
